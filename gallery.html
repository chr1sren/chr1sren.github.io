---
layout: default
title: Gallery
permalink: /gallery/
---

<div class="gallery-head">
  <h1>Gallery</h1>
</div>

{% if site.data.photos.size > 0 %}
<div class="gallery">
  {% for photo in site.data.photos %}
  {% assign ratio = photo.width | times: 1.0 | divided_by: photo.height | round: 4 %}
  <figure class="photo" style="--r: {{ ratio }}">
    <a href="{{ '/assets/photos/' | append: photo.file | relative_url }}" data-place="{{ photo.place }}" data-date="{{ photo.date }}">
      <img src="{{ '/assets/photos/thumb/' | append: photo.file | relative_url }}" alt="{{ photo.place }}" width="{{ photo.width }}" height="{{ photo.height }}" loading="lazy">
    </a>
    <figcaption>{{ photo.place }}</figcaption>
  </figure>
  {% endfor %}
</div>

<div class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
  <img alt="">
  <p class="caption"></p>
  <button class="close" aria-label="Close">×</button>
  <button class="prev" aria-label="Previous photo">‹</button>
  <button class="next" aria-label="Next photo">›</button>
</div>

<script src="{{ '/assets/js/gallery.js' | relative_url }}" defer></script>
{% else %}
<p class="empty">No photos yet.</p>
{% endif %}
